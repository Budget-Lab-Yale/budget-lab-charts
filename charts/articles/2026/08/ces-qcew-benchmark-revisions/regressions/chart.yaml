chartType: scatter
title: "Preliminary revisions are usually more positive in stronger labor markets"
subtitle: "July–January employment growth vs. preliminary CES benchmark revision, thousands of jobs, 2004–2025"
xAxisType: numeric
x_axis_title: "Preliminary benchmark revision (thousands)"
y_axis_title: "Growth, July–January (thousands)"
tooltip_decimals: 0
legend: false
tooltip_series_name: false

columns:
  x: preliminary_revision_level
  value: growth
  series: group
  point_label: year

series_order: ["Other", "2020"]
series_labels:
  Other: "Observed"
  "2020": "2020"
series_colors:
  Other: blue
  "2020": red

overlays:
  # Stata: lfit growth preliminary_revision_level if year != 2020
  - method: lm
    domain: axis
    color: blue
    label: "Linear fit"

  # Stata: function y = 789.17603 + .078694*x, range(-1000 1000), dashed green
  - fun: "b0 + b1*x"
    params:
      b0: 789.17603
      b1: 0.078694
    domain: [-1000, 1000]
    color: green
    style: dashed
    label: "SAHM-adjusted fit"
    labelSide: bottom

yAxisPolicy:
  includeZero: true
  min: -4000
  max: 4000
  tickCount: 9

source: "U.S. Bureau of Labor Statistics, [Current Employment Statistics](https://www.bls.gov/ces/)."
note: "2020, shown in red, is separated given the outsized COVID-era employment growth. The linear fit excludes it."
data: data.csv
