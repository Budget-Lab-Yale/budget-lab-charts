  - { side: positive, from: "1998-05-01", to: "1998-08-01", color: red, fillOpacity: 0.3, label: "False positives", legend: true, rug: true }
  - { side: positive, from: "2000-02-01", to: "2001-01-01", color: red, fillOpacity: 0.3, label: "False positives", legend: true, rug: true }
  - { side: positive, from: "2005-12-01", to: "2006-04-01", color: red, fillOpacity: 0.3, label: "False positives", legend: true, rug: true }
