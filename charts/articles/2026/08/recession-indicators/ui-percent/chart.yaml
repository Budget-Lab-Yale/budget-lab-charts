chartType: line
title: "A UI-based rule formulated in level (rather than rate) terms has a false positive in 2023"
subtitle: "Percent"
note: >-
  Blocks beneath the x-axis mark the months in each category; the fills in the
  plot show those months relative to the threshold. Weekly claims are shown
  monthly, taking the last observation in each month.
source: Department of Labor via FRED and authors' calculations.
xAxisType: temporal

columns:
  x: time
  value: value

yAxisPolicy:
  min: 0.0
  max: 120.0
  tickCount: 5

annotations:
  bands:
    - { start: "1970-01-01", end: "1970-12-01", color: grey, label: "US recessions", legend: true, rug: true }
    - { start: "1973-12-01", end: "1975-04-01", color: grey, label: "US recessions", legend: true, rug: true }
    - { start: "1980-02-01", end: "1980-08-01", color: grey, label: "US recessions", legend: true, rug: true }
    - { start: "1981-08-01", end: "1982-12-01", color: grey, label: "US recessions", legend: true, rug: true }
    - { start: "1990-08-01", end: "1991-04-01", color: grey, label: "US recessions", legend: true, rug: true }
    - { start: "2001-04-01", end: "2001-12-01", color: grey, label: "US recessions", legend: true, rug: true }
    - { start: "2008-01-01", end: "2009-07-01", color: grey, label: "US recessions", legend: true, rug: true }
    - { start: "2020-03-01", end: "2020-05-01", color: grey, label: "US recessions", legend: true, rug: true }
  yAxis:
    - { y: 15.0, label: "Threshold (15.0)", color: grey, labelPosition: middle }

shading:
  - { from: "1973-12-01", to: "1974-01-01", side: negative, baseline: 15.0, color: amber, fillOpacity: 0.45, label: "False negatives", legend: true, rug: true }
  - { from: "1981-08-01", to: "1981-12-01", side: negative, baseline: 15.0, color: amber, fillOpacity: 0.45, label: "False negatives", legend: true, rug: true }
  - { from: "2008-01-01", to: "2008-03-01", side: negative, baseline: 15.0, color: amber, fillOpacity: 0.45, label: "False negatives", legend: true, rug: true }
  - { from: "1969-12-01", to: "1970-01-01", side: positive, baseline: 15.0, color: red, fillOpacity: 0.3, label: "False positives", legend: true, rug: true }
  - { from: "1979-12-01", to: "1980-02-01", side: positive, baseline: 15.0, color: red, fillOpacity: 0.3, label: "False positives", legend: true, rug: true }
  - { from: "1990-07-01", to: "1990-08-01", side: positive, baseline: 15.0, color: red, fillOpacity: 0.3, label: "False positives", legend: true, rug: true }
  - { from: "2001-01-01", to: "2001-04-01", side: positive, baseline: 15.0, color: red, fillOpacity: 0.3, label: "False positives", legend: true, rug: true }
  - { from: "2023-02-01", to: "2024-02-01", side: positive, baseline: 15.0, color: red, fillOpacity: 0.3, label: "False positives", legend: true, rug: true }

data: data.csv