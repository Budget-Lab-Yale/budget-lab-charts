chartType: line
title: "The Sahm Rule (barely) triggered in 2024 without a recession ensuing"
subtitle: Percentage points
note: >-
  Blocks beneath the x-axis mark the months in each category; the fills in the
  plot show those months relative to the threshold.
source: BLS via FRED and authors' calculations. The indicator uses seasonally adjusted unemployment rates available at a given time, rather than the fully revised series of unemployment rates, which ultimately shift slightly with changes to the seasonal factors.
xAxisType: temporal
columns:
  x: time
  value: value

yAxisPolicy:
  min: 0.0
  max: 1.0
  tickCount: 5

annotations:
  bands:
    - { start: "1970-01-01", end: "1970-12-01", color: grey, label: "US recessions", legend: true, rug: true }
    - { start: "1973-12-01", end: "1975-04-01", color: grey, label: "US recessions", legend: true, rug: true }
    - { start: "1980-02-01", end: "1980-08-01", color: grey, label: "US recessions", legend: true, rug: true }
    - { start: "1981-08-01", end: "1982-12-01", color: grey, label: "US recessions", legend: true, rug: true }
    - { start: "1990-08-01", end: "1991-04-01", color: grey, label: "US recessions", legend: true, rug: true }
    - { start: "2001-04-01", end: "2001-12-01", color: grey, label: "US recessions", legend: true, rug: true }
    - { start: "2008-01-01", end: "2009-07-01", color: grey, label: "US recessions", legend: true, rug: true }
    - { start: "2020-03-01", end: "2020-05-01", color: grey, label: "US recessions", legend: true, rug: true }
  yAxis:
    - { y: 0.5, label: "Threshold (0.5)", color: grey, labelPosition: left }

shading:
  - { from: "1970-01-01", to: "1970-02-01", side: negative, baseline: 0.5, color: amber, fillOpacity: 0.45, label: "False negatives", legend: true, rug: true }
  - { from: "1973-12-01", to: "1974-03-01", side: negative, baseline: 0.5, color: amber, fillOpacity: 0.45, label: "False negatives", legend: true, rug: true }
  - { from: "1980-02-01", to: "1980-04-01", side: negative, baseline: 0.5, color: amber, fillOpacity: 0.45, label: "False negatives", legend: true, rug: true }
  - { from: "1981-08-01", to: "1981-11-01", side: negative, baseline: 0.5, color: amber, fillOpacity: 0.45, label: "False negatives", legend: true, rug: true }
  - { from: "1990-08-01", to: "1990-11-01", side: negative, baseline: 0.5, color: amber, fillOpacity: 0.45, label: "False negatives", legend: true, rug: true }
  - { from: "2001-04-01", to: "2001-06-01", side: negative, baseline: 0.5, color: amber, fillOpacity: 0.45, label: "False negatives", legend: true, rug: true }
  - { from: "2008-01-01", to: "2008-04-01", side: negative, baseline: 0.5, color: amber, fillOpacity: 0.45, label: "False negatives", legend: true, rug: true }
  - { from: "2020-03-01", to: "2020-04-01", side: negative, baseline: 0.5, color: amber, fillOpacity: 0.45, label: "False negatives", legend: true, rug: true }
  - { from: "2024-07-01", to: "2024-10-01", side: positive, baseline: 0.5, color: red, fillOpacity: 0.3, label: "False positives", legend: true, rug: true }

data: data.csv