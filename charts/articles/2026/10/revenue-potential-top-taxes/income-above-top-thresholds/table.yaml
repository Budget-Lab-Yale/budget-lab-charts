title: Projected Income Above Top-Group Thresholds, 2027
subtitle: Billions of dollars (percent of GDP), current law
notes: >-
  AGI: groups ranked and income measured by adjusted gross income. Accrual: an AGI-based accrual
  measure. Total income is the group's full income. Income above threshold is each unit's income
  in excess of the group's entry threshold. After-tax income above threshold subtracts the federal
  tax on that income.
source: The Budget Lab
data: data.csv
pane: measure
pane_order:
  - AGI
  - Accrual
stub:
  - group
header:
  - quantity
  - unit
value: value
stub_header: Group
format:
  default:
    decimals: 0
    thousands: true
  columns:
    Millions of dollars:
      decimals: 2
      prefix: "$"
    Billions of dollars:
      decimals: 0
      thousands: true
      prefix: "$"
    Percent of GDP:
      decimals: 1
      suffix: "%"
column_labels:
  Millions of dollars: "$ millions"
  Billions of dollars: "$ billions"
  Percent of GDP: "% of GDP"
header_labels:
  After-tax income above threshold: 'After-tax income \\ above threshold'
  Income above threshold: 'Income above \\ threshold'
