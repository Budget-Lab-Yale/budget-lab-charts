chartType: stacked
title: "The addition of realized and accrued capital gains does not lead to large changes in the composition of the top decile."
subtitle: "Percentage points of the top decile"
xAxisType: categorical
columns:
  x: bar
  series: series
  value: value
  facet: year
x_order: ["Portfolio", "Realized"]
series_order:                # bottom -> top
  - Entrants and exiters (Portfolio)
  - Entrants and exiters (Realized gains)
  - Everyone else
series_colors:
  "Entrants and exiters (Portfolio)": red
  "Entrants and exiters (Realized gains)": navy
  "Everyone else": "#BBBBBB"
yAxisPolicy:
  min: 0
  max: 10
small_multiples:
  columns: 10
  mode: shared
  pane_order: ["1997", "2000", "2003", "2006", "2009", "2012", "2015", "2018", "2021", "2024"]
note: "The bars show the mean between the share of those reclassified into the top decile and those reclassified out of it. Those shares are not equal due to population weighting but are similar in magnitude. Portfolio is a composite variable that includes accrued gains of equity, bonds, and real estate."
source: "Federal Reserve Survey of Consumer Finance and authors’ calculations"
data: data.csv
