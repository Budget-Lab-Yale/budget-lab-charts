chartType: stacked
orientation: horizontal
xAxisType: categorical
columns: { x: year, series: series, value: value }
x_order: ["2030", "2055"]
series_order: [immediate, career]
series_labels: { immediate: "Immediate work response", career: "Career effects" }
series_colors: { immediate: blue, career: blue-light }
