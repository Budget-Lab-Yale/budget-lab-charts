chartType: stacked
orientation: horizontal
xAxisType: categorical
columns: { x: policy, series: series, value: value, facet: year }
x_order: ["Universal subsidy", "Income-limited subsidy", "Expanded care credit", "Provider tax credit", "Child allowance"]
series_order: [immediate, career]
series_labels: { immediate: "Immediate work response", career: "Career effects" }
series_colors: { immediate: blue, career: blue-light }
small_multiples:
  mode: shared
  pane_order: ["2030", "2055"]
  pane_titles: { "2030": "2030", "2055": "2055" }
legendPosition: top
barStack: { netDisplay: none, hover: tooltip }
yAxisPolicy: { min: 0, max: 0.15, tickCount: 3 }
title: "Parents’ Contributions to Potential GDP by Policy"
subtitle: "Percent change from baseline, paid for, 2030 and 2055"
note: "Segments as in Figure 3. The child allowance’s contributions are small and negative in both years."
source: "The Budget Lab analysis."
value_suffix: "%"
tooltip_decimals: 3
data: data.csv
