chartType: stacked
orientation: horizontal
xAxisType: categorical
columns: { x: policy, series: series, value: value }
x_order: ["Universal subsidy", "Income-limited subsidy", "Expanded care credit", "Provider tax credit", "Child allowance"]
series_order: [parents, children]
series_labels:
  parents: "Parents’ work, including career effects"
  children: "Children’s adult earnings"
barStack: { netDisplay: text, hover: tooltip }
legendPosition: top
yAxisPolicy: { min: 0 }
valueLabels: { show: true, decimals: 2 }
title: "Parents’ and Children’s Contributions to Long-Run Potential GDP"
subtitle: "Percent change from baseline once every worker aged 27–65 has grown up under the policy"
note: "Holds the economy at its 2055 size, with capital fully adjusted and financing excluded, so these results cannot be added to the annual estimates. Children’s earnings use the test-score estimate. Components may not sum to totals because of rounding."
source: "The Budget Lab analysis."
value_suffix: "%"
tooltip_decimals: 2
data: data.csv
