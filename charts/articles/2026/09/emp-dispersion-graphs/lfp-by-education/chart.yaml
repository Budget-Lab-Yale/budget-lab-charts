chartType: line
title: "In terms of labor force participation, less-educated workers have recovered the ground they lost in the pandemic"
subtitle: "Ages 25–54, change since January 2020, in percentage points"
xAxisType: temporal
columns:
  x: date
  value: value
  series: series
series_order:
  - "High school or less"
  - "Some college or associate"
  - "Bachelor's degree or more"
series_colors:
  "High school or less": blue-200
  "Some college or associate": amber
  "Bachelor's degree or more": blue-600
y_axis_title: "Percentage points"
yAxisPolicy:
  includeZero: true
annotations:
  xAxis:
    - { x: "2020-01-01", label: "Jan 2020 = 0" }
note: "Lines are trailing 12-month averages of the labor force participation rate within each education group, additively indexed to January 2020 = 0. Groups are observed education, not predicted propensity: high school or less includes GED holders, and bachelor's degree or more includes advanced degrees. The October 2025 CPS was never collected; any trailing average whose window spans it is taken over the months that exist."
source: "IPUMS CPS basic monthly samples, authors' calculations."
data: data.csv
