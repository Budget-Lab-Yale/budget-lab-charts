chartType: dumbbell
title: "The necessary differences in the spending shares necessary for the K-shape to appear are not present in the CE, even across groups that are vastly different."
subtitle: "Spending difference between groups, thousands of dollars"
xAxisType: categorical
orientation: horizontal
columns:
  category: comparison
  series: series
  value: value
x_order:                     # top -> bottom, as in the script
  - "Ages 45-54 vs. Ages 55-65"
  - "Decile 10 vs. 1"
  - "Decile 10 vs. 9"
  - "Decile 10 vs. 1 (expenditure)"
  - "Owners vs. renters"
x_labels:
  "Ages 45-54 vs. Ages 55-65": "Ages 45-54 vs. Ages 55-65 (min: 2013, max: 2024)"
  "Decile 10 vs. 1": "Decile 10 vs. 1 (min: 2013, max: 2023)"
  "Decile 10 vs. 9": "Decile 10 vs. 9 (min: 2004, max: 2006)"
  "Decile 10 vs. 1 (expenditure)": "Decile 10 vs. 1 (expenditure) (min: 2011, max: 2023)"
  "Owners vs. renters": "Owners vs. renters (min: 2020, max: 2007)"
