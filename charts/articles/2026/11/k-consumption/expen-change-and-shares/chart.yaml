chartType: line
title: "Spending has grown at similar rates across deciles, and spending shares have been approximately flat for 20 years"
subtitle: "Left: spending index, 2004 = 100. Right: share of total expenditure, percent"
xAxisType: temporal
columns:
  x: year
  series: series
  value: value
  facet: panel
series_order:
  - Decile 1
  - Decile 5
  - Decile 10
small_multiples:
  columns: 2
  mode: per-pane
  pane_order:
    - "Indexed spending (2004 = 100)"
    - "Share of total expenditure (%)"
annotations:
  xAxis:
    - { x: "2004" }          # base year
  # yAxis y: 100 intentionally omitted: it would sit far off the shares panel (3-23%) and could stretch its axis.
note: "Left panel measures the indexed change in spending for deciles 1, 5, and 10. Right panel measures total consumption for each decile relative to total consumption across all deciles."
source: "BLS Consumer Expenditure Survey"
data: data.csv
