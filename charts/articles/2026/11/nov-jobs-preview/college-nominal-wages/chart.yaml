chartType: line
title: "Wage growth for noncollege graduates has been lower than for college graduates since 2024"
subtitle: "Nominal wage growth (%)"
tooltip_decimals: 1

xAxisType: temporal
series_order: [no_college, college]
series_labels:
  no_college: "No college"
  college: "College"

note: "Series are the 12-month averages of year-over-year nominal wage growth for college and noncollege workers. Noncollege includes those with a high school degree or less; college includes those with at least a 4-year bachelor’s degree. There is a gap in October 2025 because no Current Population Survey data were collected that month."
source: "Federal Rexerve Bank of Atlanta."
